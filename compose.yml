services:
    mangalib:
        build: .
        image: mangalib
        ports:
            - "5000:5000"
        volumes:
            # Database and config (the config, with a random secret key, is created on first start)
            - ./data/db:/var/db
            - ./data/config:/var/config
            # Your manga library. Change the left side to where your manga lives,
            # then add /var/manga as a library folder in Settings > Library.
            - ./manga:/var/manga:ro
        # The new interface is at http://localhost:5000 and the classic one at http://localhost:5000/classic/
        restart: unless-stopped
