{% extends 'base.html' %}
{% block title %}
    Edit - {{manga.title}}
{% endblock %}

{% block style %}
<link rel="stylesheet" href="/static/assets/css/styles/manga-editor.css">
{% endblock %}

{% block content %}
<script>
function reset_form(id, value) {
    let element = document.getElementById(id);
    element.value = value;
}

async function updateMangaTitle(id, old_title, new_title) {
    if(old_title === new_title) {
        return;
    }

    let message = `You will be updating the title of manga id ${id} to '${new_title}'. Are you sure you wish to proceed?`
    if(confirm(message)) {
        const url = "{{ url_for('api.edit_manga_title', manga_id=manga.id) }}";
        let formData = new FormData();
        formData.append("title", new_title);
        try {
            const response = await fetch(url, {method: "POST", body: formData});
            if(!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            } else {
                location.reload();
            }
        } catch(error) {
            console.error(error.message);
        }
    }
}
</script>

<script>
    function addTagRow(tag) {
        const tag_item_template = `<div class="tag-grid-item w3-button" onclick="removeTag(this, this.textContent)">${ tag }</div>`;
        document.getElementById("tag-grid").innerHTML += tag_item_template;
    }
</script>

<div class="settings-panel manga-grid-container w3-padding w3-xlarge text-shadow">
    <label class="no-hover" for="manga_title">Title:</label>
    <input type="text" id="manga_title" value="{{ manga.title }}">
    <button class="w3-button w3-round-large" onclick="reset_form('manga_title', '{{ manga.title }}')">Reset</button>
    <button class="w3-button w3-round-large w3-right" onclick="updateMangaTitle('{{ manga.id }}', '{{ manga.title }}', document.getElementById('manga_title').value)">Save</button>

    <form name="manga-tags-form">
        <div class="no-hover w3-xxlarge"><u>Admin Settings</u></div>
        <div class="w3-container w3-padding">
            <div class="w3-xlarge no-hover"><b>Tags</b></div>
            <div id="tag-grid" class="tag-grid w3-grid">
            </div>
        </div>
    </form>
</div>
{% endblock %}
