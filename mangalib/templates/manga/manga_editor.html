{% extends 'manga/manga_base.html' %}
{% block title %}
    Edit - {{manga.title}}
{% endblock %}

{% block style %}
<link rel="stylesheet" href="/static/assets/css/styles/manga-editor.css">
{% endblock %}

{% block content %}
<script>
function reset_form(id, value) {
    let element = document.getElementById(id);
    element.value = value;
}

async function updateMangaTitle(id, old_title, new_title) {
    if(old_title === new_title) {
        return;
    }

    let message = `You will be updating the title of manga id ${id} to '${new_title}'. Are you sure you wish to proceed?`
    if(confirm(message)) {
        const url = "{{ url_for('api.edit_manga_title', manga_id=manga.id) }}";
        let formData = new FormData();
        formData.append("title", new_title);
        try {
            const response = await fetch(url, {method: "POST", body: formData});
            if(!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            } else {
                location.reload();
            }
        } catch(error) {
            console.error(error.message);
        }
    }
}
</script>

<script>
    function load_tags(tags) {
        const table = document.getElementById("content-tags");
        for(index in tags) {
            tag = tags[index];
            addTagRow(tag, manga.manga_metadata.tags.includes(tag));
        }
    }

    function addTagRow(tag, checked=false) {
        const tag_item_template = `
        <label class="tag-checkbox tag-grid-item" for="tag-${tag}-toggle">
            <input name="${tag}" id="tag-${tag}-toggle" type="checkbox"${checked ? " checked" : ""}>
            <span class="w3-button">${ tag }</span>
        </label>
        `;
        document.getElementById("tag-grid").innerHTML += tag_item_template;
    }

    addEventListener("load", async () => {
        {# const manga_tag_url = "{{ url_for('api.get_manga_tags', manga_id= manga.id) }}";
        await fetch(manga_tag_url).then(response => response.ok ? response.json().then(json => manga_tags = json.tags) : false); #}

        const tag_url = "{{ url_for('api.get_content_tags') }}";
        await fetch(tag_url).then(response => response.ok ? response.json().then(json => load_tags(json.tags)) : false);
    })

</script>

<div class="settings-panel manga-grid-container w3-padding w3-xlarge text-shadow">
    <div class="no-hover" for="manga_title"><b>Title</b></div>
    <input type="text" id="manga_title" value="{{ manga.title }}">
    <button class="w3-button w3-grey w3-round-large" onclick="reset_form('manga_title', '{{ manga.title }}')">Reset</button>
    <button class="w3-button w3-round-large w3-right" onclick="updateMangaTitle('{{ manga.id }}', '{{ manga.title }}', document.getElementById('manga_title').value)">Save</button>
    <div class="no-hover"><b>Tags</b></div>
    <form name="manga-content-tags-input" method="post" style="display: inline; margin: 0;">
        <div>
            <div id="tag-grid" class="tag-grid"></div>
        </div>
        <label for="tag-save-submit">
            <input type="submit" class="w3-button w3-grey w3-round-large" value="Save Tags" formaction="{{ url_for('api.set_content_tags', manga_id=manga.id) }}">
        </label>
    </form> 
</div>
{% endblock %}
