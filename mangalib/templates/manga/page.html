{% extends 'base.html' %}
{% block title %}{{manga.title}}{% endblock %}

{% block script %}
    <script src="{{ url_for('static', filename='assets/scripts/manga-page.js') }}"></script>
    <script>
        // {% if page.number + 1 <= chapter.pages|length %}
        next_page = "{{ url_for('manga') }}/{{ manga.id }}/{{ chapter.number }}/{{ page.number + 1 }}"
        // {% elif manga.chapters|length > 1 %}
        next_page = "{{ url_for('manga') }}/{{ manga.id }}/{{ chapter.number + 1 }}/1"
        // {% else %}
        next_page = "{{ url_for('manga') }}/{{ manga.id }}"
        // {% endif %}

        // {% if page.number - 1 > 0 %}
        prev_page = "{{ url_for('manga') }}/{{ manga.id }}/{{ chapter.number }}/{{ page.number - 1 }}"
        // {% elif chapter.number - 1 > 0 %}
        prev_page = "{{ url_for('manga') }}/{{ manga.id }}/{{ chapter.number - 1 }}/{{ manga.chapters[chapter.number-2].pages|length }}"
        // {% else %}
        prev_page = "{{ url_for('manga') }}/{{ manga.id }}"
        // {% endif %}
    </script>
{% endblock %}

{% block content %}
<div class="manga-page">
    <div class="grads">
        <div id="left-grad" class=""></div>
        <div id="right-grad" class=""></div>
    </div>
    <div id="page-content" class="page-content fill-height">
        <!-- Need DIV for mouse events -->
        <div id="page-zone" class="page-zone fill-height">
            <i id="load-icon" class="fa fa-spinner load-spin"></i>
            <img id="page-image" class="no-hover fill-height w3-image w3-hide" src="{{ url_for('manga-image') }}/{{ manga.id }}/{{ chapter.number }}/{{ page.number }}" alt="Page">
        </div>
    </div>
</div>
{% endblock %}

{% block content_footer %}
<div class="w3-center text-shadow w3-text-white w3-xlarge">{{ page.number }} / {{ chapter.pages|length }}</div>
{% endblock %}
