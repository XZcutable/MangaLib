{% extends 'base.html' %}
{% block title %}Manga Title Here{% endblock %}

{% block script %}
<script>
    addEventListener('load', onLoad);

    document.addEventListener("keydown", function(event) {
        if (event.key === "ArrowRight" || event.key === "d") {
            nextPage();
        } else if (event.key === "ArrowLeft" || event.key === "a") {
            prevPage();
        }
    });

    function onLoad() {
        let page = document.getElementById("page");
        let aspect = page.naturalHeight / page.naturalWidth;
        
        if(aspect > 2) {
            page.classList.remove("fill-height")
        }

        page.classList.remove("w3-hide")

        var pages = document.getElementsByClassName("page-content");
        for(var i = 0; i < pages.length; i++) {
            let page = pages[i];
            page.addEventListener('touchstart', touchStart)
            page.addEventListener('touchmove', touchMove)
            page.addEventListener('touchend', touchEnd)
            page.addEventListener('touchcancel', touchCancel)

            page.addEventListener('mousedown', mouseDown)
            page.addEventListener('mouseup', mouseUp)
        };
    }

    let clicking = false;
    let mouseX = 0

    function mouseDown(event) {
        clicking = event.button == 0;
        mouseX = event.clientX;
    }

    function mouseUp(event) {
        if(clicking && event.button == 0) {
            clicking = false;

            let isClickedLeft1 = mouseX < (event.currentTarget.offsetWidth / 2);
            mouseX = event.clientX;
            let isClickedLeft2 = mouseX < (event.currentTarget.offsetWidth / 2);

            if(isClickedLeft1 === isClickedLeft2) {
                if(isClickedLeft1) {
                    prevPage();
                }
                else {
                    nextPage();
                }
            }
        }
    }


    let startX = -1;
    let dragging = false;
    let dir = 0;
    let dragDist = 40;
    let minXBeforeDrag = 30;
    
    let minYBeforeScroll = 30;
    let startY = 0;
    let scrolling = false;

    function touchStart(event) {
        if (event.touches.length == 1) {
            startX = event.touches[0].clientX;
            startY = event.touches[0].clientY;
            dir = 0;
        }
    }

    function touchMove(event) {
        if(scrolling) {
            return;
        }

        if (event.touches.length == 1) {
            let yDelta = Math.abs(event.touches[0].clientY - startY);

            if(!dragging && yDelta >= minYBeforeScroll) {
                scrolling = true;
                return;
            }

            let deltaX = Math.min(dragDist, Math.max(-dragDist, event.touches[0].clientX - startX));
            if(!dragging && Math.abs(deltaX) >= minXBeforeDrag) {
                dragging = true;
            } 
            
            if(dragging) {
                let curDir = Math.sign(deltaX);
                if(curDir != dir) {
                    dir = curDir;
                    startX = event.touches[0].clientX;
                    deltaX = Math.min(dragDist, Math.max(-dragDist, event.touches[0].clientX - startX));
                }
                event.currentTarget.style.transform = `translate(${deltaX}px, 0px)`;
            }
        }
    }

    function touchEnd(event) {
        // event.preventDefault();

        if(dragging) {
            let endX = event.changedTouches[0].clientX;
            if(Math.abs(endX - startX) > dragDist) {
                if (endX < startX) {
                    nextPage();
                } else {
                    prevPage();
                }
            }
        } else if(!scrolling) {
            let endX = event.changedTouches[0].clientX;
            let isTappedLeft = startX < (event.currentTarget.offsetWidth / 2);
            if (isTappedLeft) {
                prevPage();
            } else {
                nextPage();
            }
        }
        dragging = false;
        scrolling = false;
        event.currentTarget.style.transform = `translate(0px, 0px)`;
    }

    function touchCancel(event) {
        // event.preventDefault();
        dragging = false;
        scrolling = false;
        event.currentTarget.style.transform = `translate(0px, 0px)`;
    }

    function nextPage() {
        window.location = "{{ next_page }}";
    }

    function prevPage() {
        // {% if prev_page %}
        window.location = "{{ prev_page }}";
        // {% endif %}
    }
</script>
{% endblock %}

{% block content %}
<div class="manga-page w3-center">
    <div class="page-content fill-height">
        <!-- Need DIV for mouse events -->
        <img id="page" class="no-hover fill-height w3-hide" src="{{ page_image }}" alt="Page">
    </div>
</div>
{% endblock %}

{% block content_footer %}
<div class="w3-center text-shadow w3-text-white w3-xlarge">{{ current_page }} / {{ total_pages }}</div>
{% endblock %}
