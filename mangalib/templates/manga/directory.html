{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% from 'manga/manga.html' import manga_grid %}

{% block script %}
    <script src="{{ url_for('static', filename='infinite-scroll.js') }}"></script>
{% endblock %}

{% block content %}

<div class="manga-grid-container">
    {% if titles|length <= 0 %}
        <span class="w3-text-white w3-xxlarge text-shadow no-hover w3-padding"><strong>All Uploads</strong></span>
        <div class="w3-text-white w3-xxlarge text-shadow no-hover">Nothing yet :(</div>
    {% else %}
        <span class="w3-text-white w3-xxlarge text-shadow no-hover w3-padding"><strong>All Uploads</strong></span>
        {{ manga_grid(titles) }}
    {% endif %}
</div>
{% endblock %}
