{% macro manga_card(title_id, title, uploader, upload_date) -%}
    <div class="w3-card w3-round-large">
        <a href="{{ url_for('manga') }}?id={{ title_id }}">
            <img src="/static/test-thumbnail.jpg" alt="Thumbnail" style="width: 100%;" class="w3-round-large w3-hover-opacity">
            <span class="w3-small w3-padding-small w3-text-white text-shadow w3-left">{{ title }}</span>
        </a>
    </div>
{%- endmacro %}
