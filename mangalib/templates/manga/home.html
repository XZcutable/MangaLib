{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% from 'manga/manga.html' import manga_grid %}

{% block content %}
<div class="manga-grid-container">
    {% if titles|length <= 0 %}
        <span class="w3-text-white w3-xxlarge text-shadow no-hover w3-padding"><strong>Latest Uploads</strong></span>
        <div class="w3-text-white w3-xxlarge text-shadow no-hover">Nothing yet :(</div>
    {% else %}
        <span class="w3-text-white w3-xxlarge text-shadow no-hover w3-padding"><strong>Latest Uploads</strong></span>
        {{ manga_grid(titles) }}
    {% endif %}
</div>
{% endblock %}
