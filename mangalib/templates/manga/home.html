{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% from 'manga/manga.html' import manga_card %}

{% block content %}
    <div class="w3-row w3-padding">
        <div class="w3-col w3-container l1"></div>
        <div class="w3-col l10">
            <a href="{{ url_for('manga.latest') }}" class="w3-text-white w3-xxlarge text-shadow"><strong>Latest Uploads</strong></a>
            {% if titles|length == 0 %}
                <div class="w3-text-white w3-xxlarge text-shadow no-hover">Nothing yet :(</div>
            {% else %}
                <div class="w3-grid-padding w3-padding w3-border-bottom" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr">
                    {% for id, title in titles %}
                        {{ manga_card(id, title) }}
                    {% endfor %}
                </div>
            {% endif %}
        </div> 
        <div class="w3-col w3-rest"></div>
    </div>
{% endblock %}
