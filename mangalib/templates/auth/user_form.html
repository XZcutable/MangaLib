<div class="w3-padding">
    <div class="w3-container w3-col l3"></div>
    <div class="w3-container w3-col l6 w3-light-gray w3-center w3-xlarge w3-round-large">
        <form method="post">
            <div class="w3-row w3-padding-16">
                <label for="username" class="no-hover">Username:</label>
                <input name="username" id="username" class="w3-round" value="{{ last_username }}" required>
            </div>
            <div class="w3-row">
                <label for="password" class="no-hover">&nbsp;Password:</label>
                <input type="password" name="password" id="password" class="w3-round" value="{{ last_password }}" required>
            </div>
            <div class="w3-row w3-padding-16">
                <input class="w3-padding w3-button w3-grey w3-round-large" type="submit" value="{{ submit|safe }}">
            </div>
        </form>
    </div>
    <div class="w3-container w3-col l3"></div>
</div>
