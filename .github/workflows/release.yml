# Builds and publishes a release when a version tag (v1.2.3) arrives, which happens when it's pushed to
# GitLab and the push mirror copies it here. `pnpm release 1.2.3` makes and pushes the tag, with the notes
# from CHANGELOG.md's Unreleased section as its message (the release text).
# It runs scripts/release.mjs, the same script as a release from the PC: signed APK + server bundle on
# the GitHub release, Docker image on ghcr.io/xzcutable/mangalib.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   release.jks as base64 (losing or changing it means phones can't update)
#   ANDROID_STORE_PASSWORD    storePassword from release.properties
#   ANDROID_KEY_ALIAS         keyAlias
#   ANDROID_KEY_PASSWORD      keyPassword
#   GHCR_TOKEN (optional)     classic token with write:packages, only if the built-in token can't push the image
#
# Test run: Actions -> Release -> "Run workflow" builds the version in package.json (APK, bundle, Docker
# image) with --dry-run, so nothing is published. Use it to check the secrets and signing still work.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files
  packages: write # push the Docker image

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install . pytest
      - run: python -m pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true # images, icons and the Gradle wrapper are in Git LFS (the GitLab mirror copies them)

      - name: Pick the version and release notes
        # A tag push publishes the tag's version; a manual run test-builds package.json's version.
        # Checkout keeps only the commit a tag points to, so fetch the tag itself for its message.
        run: |
          : > "$RUNNER_TEMP/notes.md"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "VERSION=$(jq -r .version manga-site/package.json)" >> "$GITHUB_ENV"
            echo "RELEASE_MODE=--dry-run" >> "$GITHUB_ENV"
            echo "Test run: nothing will be published"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
              git tag --list --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
            fi
            cat "$RUNNER_TEMP/notes.md"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the server's packages
        # make_server_bundle.py imports mymangalib (for the update protocol number), which needs Flask
        run: pip install .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install the app's packages
        working-directory: manga-site
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/release.properties"
          echo "MYMANGALIB_SIGNING=$RUNNER_TEMP/release.properties" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          PYTHON: python
        run: node scripts/release.mjs "$VERSION" --ci $RELEASE_MODE --notes-file "$RUNNER_TEMP/notes.md"
