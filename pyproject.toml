[project]
name = "mymangalib"
version = "1.4.1"
description = "Host and view your Manga locally"
requires-python = ">=3.11"
dependencies = [
    "flask", "Flask-SQLAlchemy", "Flask-Cors", "PyMuPDF", "waitress"
]

[project.scripts]
mymangalib = "mymangalib.cli:main"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
