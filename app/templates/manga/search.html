{% extends 'manga/manga_infinite_scroll.html' %}
{% block title %}Search{% endblock %}

{% set title %}
Results ({{ result_count }})

{% block script %}
{{ super() }}

<script>
async function fetchTitles(offset) {
    try {
        var request = `${QUERY_SEARCH_URL}?offset=${offset}&sort=${sort}&q={{ request.args['q'] }}`;
        const response = await fetch(request);
        if(response.status == 200) {
            const json = await response.json();
            return json;
        }
    } catch {
        console.log("Error Fetching Tiles")
    }
    throw "No Json"
}
</script>
{% endblock %}

{% block grid_header %}
<form method="get" class="w3-padding" action="{{ url_for('manga.search') }}">
    <input id="search-bar" name="q" class="w3-padding" style="width: 100%;" type="search" placeholder="search" value="{{ request.args.q }}" minlength="1" required>
</form>
{% endblock %}
