{% extends 'manga/manga_infinite_scroll.html' %}
{% block title %}Search{% endblock %}

{% set title %}
Results ({{ results|length }})
{% endset %}

{% block script %}
{{ super() }}

<script>
results = {{ results|tojson }};

async function fetchTitles(batch_size, offset) {
    return results.slice(offset, offset + batch_size);
}
</script>
{% endblock %}

{% block grid_header %}
<form method="get" class="w3-padding" action="{{ url_for('manga.search') }}">
    <input id="search-bar" name="q" class="w3-padding" style="width: 100%;" type="search" placeholder="search" value="{{ request.args.q }}" minlength="1" required>
</form>
{% endblock %}
