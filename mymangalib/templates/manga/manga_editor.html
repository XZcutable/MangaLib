{% extends 'manga/manga_base.html' %}
{% block title %}
    Edit - {{manga.title}}
{% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/styles/manga-editor.css') }}">
{% endblock %}

{% block content %}
<script>
function reset_title(original=false) {
    let element = document.getElementById("manga_title");
    element.value = original ? manga.original_title : manga.title;
}

async function updateMangaTitle() {
    let element = document.getElementById("manga_title");
    let old_title = manga.title;
    let new_title = element.value;
    if(old_title === new_title) {
        return;
    }

    let message = `You will be updating the title of manga id {{ manga.id }} to '${new_title}'. Are you sure you wish to proceed?`
    if(confirm(message)) {
        const url = "{{ url_for('api.edit_manga_title', manga_id=manga.id) }}";
        let formData = new FormData();
        formData.append("title", new_title);
        try {
            const response = await fetch(url, {method: "POST", body: formData});
            if(!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            } else {
                location.reload();
            }
        } catch(error) {
            console.error(error.message);
        }
    }
}
</script>

<script>
    function deleteManga(manga_id) {
        if (confirm("Are you sure you want to delete this manga?")) {
            document.location = "{{ url_for('api.delete_manga', manga_id=manga.id) }}"
        }
    }

    function rescan(manga_id) {
        if (confirm("Are you sure you want to rescan this manga?")) {
            document.location = "{{ url_for('api.rescan', manga_id=manga.id) }}"
        }
    }

    function load_tags(tagsJson) {
        const table = document.getElementById("content-tags");
        console.log(manga.manga_metadata.tags)
        for(index in tagsJson) {
            json = tagsJson[index];
            addTagRow(json, manga.manga_metadata.tags.some(o => o.tag == json.tag));
        }
    }

    function addTagRow(json, checked=false) {
        const tag = escapeHtml(json.tag);
        const tag_item_template = `
        <label class="tag-checkbox tag-grid-item" for="tag-${tag}-toggle">
            <input name="${tag}" id="tag-${tag}-toggle" type="checkbox"${checked ? " checked" : ""}>
            <span class="w3-button">${tag}</span>
        </label>
        `;
        if(json.nsfw) {
            document.getElementById("nsfw-tag-grid").innerHTML += tag_item_template;
        } else {
            document.getElementById("tag-grid").innerHTML += tag_item_template;
        }
    }

    addEventListener("load", async () => {
        {# const manga_tag_url = "{{ url_for('api.get_manga_tags', manga_id=manga.id) }}";
        await fetch(manga_tag_url).then(response => response.ok ? response.json().then(json => manga_tags = json.tags) : false); #}

        const tag_url = "{{ url_for('api.get_content_tags') }}";
        await fetch(tag_url).then(response => response.ok ? response.json().then(json => load_tags(json.tags)) : false);
    })

</script>

<div class="settings-panel manga-grid-container w3-padding w3-xlarge text-shadow">
    <button class="w3-button w3-large w3-grey w3-round-large" onclick="document.location=&quot;{{ url_for('manga.info', manga_id=manga.id) }}&quot;">Back</button>
    <div class="no-hover" for="manga_title"><b>Title</b></div>
    <input type="text" id="manga_title" value="{{ manga.title }}">
    <div class="" style="display: inline; width: 100%; text-wrap-mode: nowrap; text-align: center;">
        <button class="w3-button w3-grey w3-round-large" onclick="reset_title()">Reset</button>
        <button class="w3-button w3-grey w3-round-large" onclick="reset_title(true)">True Reset</button>
         <div class="" style="display: inline-block; width: 35vw; overflow: hidden; text-wrap-mode: nowrap; text-overflow: ellipsis;">
            <span class="w3-large no-hover" style="">{{ manga.original_title }}</span>
        </div>
        <button class="w3-button w3-round-large w3-right" onclick="updateMangaTitle()">Save</button>
    </div>
    <form name="manga-content-tags-input" method="post">
        <div class="no-hover"><b>Tags</b></div>
        <div>
            <div id="tag-grid" class="tag-grid"></div>
        </div>
        <div class="no-hover"><b>NSFW Tags</b></div>
        <div>
            <div id="nsfw-tag-grid" class="tag-grid"></div>
        </div>
        <label for="tag-save-submit">
            <input id="tag-save-submit" type="submit" class="w3-button w3-grey w3-round-large" value="Save Tags" formaction="{{ url_for('api.set_content_tags', manga_id=manga.id) }}">
        </label>
        {% if isOwner%}
        <div class="no-hover"><b>Tools</b></div>
        </form>
            <button class="w3-button w3-grey w3-round-large" onclick="rescan({{ manga.id }})">Rescan Manga</button>
        </form>
        {# </form name="manga-open-directory" method="GET">
            <label for="open-dir-submit">
                <input id="open-dir-submit" type="submit" class="w3-button w3-grey w3-round-large" value="Open Directory" formaction="{{ url_for('api.open_manga_dir', manga_id=manga.id) }}">
            </label>
        </form> #}
        <div class="no-hover"><b>Danger Zone</b></div>
        </form>
            <button class="w3-button w3-round-large w3-red w3-right" onclick="deleteManga({{ manga.id }})">Delete Manga</button>
        </form>
        {% endif %}
</div>
{% endblock %}
